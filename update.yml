name: Refresh job board

on:
  schedule:
    - cron: '0 6,12,18 * * *'   # 06:00, 12:00, 18:00 UTC
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scrape.py run
      - name: Commit updated jobs
        run: |
          git config user.name  "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --staged --quiet || git commit -m "Refresh jobs $(date -u +%Y-%m-%d\ %H:%M)"
          git push
