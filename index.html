<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Early careers in UK finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f7f5; --card:#fff; --ink:#14202a; --muted:#5f6e7b;
    --rule:#dde2e6; --rail:#e4e8ea; --fresh:#0b6b3a; --fresh-bg:#e8f2ec;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:400 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:940px; margin:0 auto; padding:44px 20px 80px}

  header{display:flex; justify-content:space-between; align-items:baseline;
    gap:16px; flex-wrap:wrap; padding-bottom:18px; border-bottom:2px solid var(--ink)}
  h1{font-size:24px; font-weight:600; margin:0; letter-spacing:-.015em}
  .stamp{font-size:13px; color:var(--muted)}
  .blurb{margin:14px 0 26px; color:var(--muted); font-size:14px; max-width:62ch}

  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
  #q{flex:1 1 240px; min-width:0; padding:9px 12px; font:inherit; color:inherit;
    background:var(--card); border:1px solid var(--rule); border-radius:3px}
  #q:focus{outline:2px solid var(--ink); outline-offset:-1px}
  .tabs{display:flex; gap:0; border:1px solid var(--rule); border-radius:3px;
    background:var(--card); overflow:hidden}
  .tabs button{font:500 13px/1 inherit; color:var(--muted); background:none;
    border:0; border-right:1px solid var(--rule); padding:10px 13px; cursor:pointer}
  .tabs button:last-child{border-right:0}
  .tabs button:hover{color:var(--ink); background:#f0f2f3}
  .tabs button[aria-pressed=true]{background:var(--ink); color:#fff}
  .tabs button:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}

  .tally{font-size:13px; color:var(--muted); margin:0 0 18px; height:20px}

  ul{list-style:none; margin:0; padding:0}
  li a{display:grid; grid-template-columns:150px 1fr auto; gap:18px; align-items:baseline;
    text-decoration:none; color:inherit; background:var(--card);
    border:1px solid var(--rule); border-left:3px solid var(--rail);
    border-radius:2px; padding:12px 16px; margin-bottom:5px}
  li a:hover{border-color:var(--ink); border-left-color:var(--ink)}
  li a:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
  li.fresh a{border-left-color:var(--fresh)}
  .firm{font-weight:600; font-size:14px}
  .role{font-size:15px}
  .where{display:block; font-size:13px; color:var(--muted); margin-top:2px}
  .meta{font-size:12px; color:var(--muted); white-space:nowrap; text-align:right}
  .tag{display:inline-block; font-size:12px; color:var(--muted);
    border:1px solid var(--rule); border-radius:2px; padding:1px 6px; margin-left:8px}
  .new{color:var(--fresh); background:var(--fresh-bg); border-color:#c3ddcf; font-weight:500}

  .empty{padding:48px 4px; color:var(--muted); font-size:14px; max-width:52ch}
  .empty code{background:#eceeef; padding:1px 5px; border-radius:2px; font-size:13px}
  footer{margin-top:40px; padding-top:16px; border-top:1px solid var(--rule);
    font-size:12px; color:var(--muted)}

  @media (max-width:620px){
    .wrap{padding:28px 16px 60px}
    li a{grid-template-columns:1fr; gap:3px; padding:12px 14px}
    .meta{text-align:left}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Early careers in UK finance</h1>
    <span class="stamp" id="stamp"></span>
  </header>

  <p class="blurb">Off-cycle, graduate, summer and placement roles, read straight
  from each firm's own application system a few times a day. Green edge means it
  appeared in the last week.</p>

  <div class="controls">
    <input id="q" type="search" placeholder="Search firm, role or city" autocomplete="off">
    <div class="tabs" id="tabs">
      <button data-cat="all" aria-pressed="true">All</button>
      <button data-cat="off-cycle" aria-pressed="false">Off-cycle</button>
      <button data-cat="graduate" aria-pressed="false">Graduate</button>
      <button data-cat="summer" aria-pressed="false">Summer</button>
      <button data-cat="placement" aria-pressed="false">Placement</button>
    </div>
  </div>

  <p class="tally" id="tally"></p>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>

  <footer id="foot"></footer>
</div>

<script>
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const tally = document.getElementById('tally');
const q = document.getElementById('q');
let jobs = [], cat = 'all';

const DAY = 864e5;
const fresh = j => j.first_seen && (Date.now() - Date.parse(j.first_seen)) < 7 * DAY;

function ago(iso){
  if(!iso) return '';
  const d = Math.floor((Date.now() - Date.parse(iso)) / DAY);
  if (d <= 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 31) return d + ' days ago';
  return Math.floor(d / 30) + ' months ago';
}

function esc(s){ return (s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function render(){
  const term = q.value.trim().toLowerCase();
  const rows = jobs.filter(j =>
    (cat === 'all' || j.category === cat) &&
    (!term || (j.company + ' ' + j.title + ' ' + j.location).toLowerCase().includes(term))
  );

  list.innerHTML = rows.map(j => `
    <li class="${fresh(j) ? 'fresh' : ''}">
      <a href="${esc(j.url)}" target="_blank" rel="noopener">
        <span class="firm">${esc(j.company)}</span>
        <span>
          <span class="role">${esc(j.title)}</span>
          ${fresh(j) ? '<span class="tag new">New</span>' : ''}
          <span class="tag">${esc(j.category)}</span>
          <span class="where">${esc(j.location) || 'Location not listed'}</span>
        </span>
        <span class="meta">${ago(j.posted)}</span>
      </a>
    </li>`).join('');

  const n = rows.filter(fresh).length;
  tally.textContent = rows.length
    ? `${rows.length} open ${rows.length === 1 ? 'role' : 'roles'}${n ? `, ${n} added this week` : ''}`
    : '';

  if (!rows.length && jobs.length){
    empty.hidden = false;
    empty.textContent = 'Nothing matches that. Try a shorter search, or switch to All.';
  } else {
    empty.hidden = true;
  }
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  cat = b.dataset.cat;
  [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
q.addEventListener('input', render);

fetch('jobs.json?' + Date.now())
  .then(r => { if(!r.ok) throw new Error('missing'); return r.json(); })
  .then(data => {
    jobs = data.jobs || [];
    const d = new Date(data.updated);
    document.getElementById('stamp').textContent =
      'Updated ' + d.toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
    document.getElementById('foot').textContent =
      'Roles are collected automatically and may be out of date. Always check the firm\u2019s own page before applying.';
    render();
  })
  .catch(() => {
    empty.hidden = false;
    empty.innerHTML = 'No data yet. Run <code>python scrape.py run</code>, or wait for the ' +
      'scheduled job to finish its first pass.';
  });
</script>
</body>
</html>
